+proxy-groups:
  - name: Claude专用
    type: select
    proxies:
      - "🇺🇸 美国家宽Hawaiian | 3.0x"
      - "🇺🇸 美国家宽Frontier | 3.0x"
      - "🇺🇸 美国家宽ATT | 3.0x"
      - "🇺🇸 美国家宽Verizon | 3.0x"
    icon: "https://claude.ai/favicon.ico"

  - name: 通用代理
    type: select
    include-all-proxies: true
    filter: "^(?!.*(家宽|剩余|距离|套餐)).*$"
    icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png"

+rules:
  - DOMAIN-SUFFIX,anthropic.com,Claude专用
  - DOMAIN-SUFFIX,claude.ai,Claude专用
  - DOMAIN,cdn.usefathom.com,Claude专用
  - DOMAIN-SUFFIX,dl.google.com,通用代理
  - DOMAIN-SUFFIX,dl.l.google.com,通用代理
  - DOMAIN-SUFFIX,tools.google.com,通用代理
  - DOMAIN-SUFFIX,tools.l.google.com,通用代理
  - DOMAIN-SUFFIX,cache.pack.google.com,通用代理
  - DOMAIN-KEYWORD,gvt1,通用代理
  - DOMAIN-KEYWORD,gvt2,通用代理
  - DOMAIN-KEYWORD,gvt3,通用代理
