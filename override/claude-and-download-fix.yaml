+proxy-groups:
  - name: ✴️ Claude专用
    type: url-test
    include-all-proxies: true
    filter: "(台湾|新加坡|马来|日本|美国|加拿大)家宽"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    icon: "https://claude.ai/favicon.ico"

  - name: 🌐 通用代理
    type: url-test
    include-all-proxies: true
    filter: "^(?!.*(家宽|剩余|距离|套餐)).*$"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

+rules:
  - DOMAIN-SUFFIX,anthropic.com,✴️ Claude专用
  - DOMAIN-SUFFIX,claude.ai,✴️ Claude专用
  - DOMAIN,cdn.usefathom.com,✴️ Claude专用
  - DOMAIN-SUFFIX,dl.google.com,🌐 通用代理
  - DOMAIN-SUFFIX,dl.l.google.com,🌐 通用代理
  - DOMAIN-SUFFIX,tools.google.com,🌐 通用代理
  - DOMAIN-SUFFIX,tools.l.google.com,🌐 通用代理
  - DOMAIN-SUFFIX,cache.pack.google.com,🌐 通用代理
  - DOMAIN-KEYWORD,gvt1,🌐 通用代理
  - DOMAIN-KEYWORD,gvt2,🌐 通用代理
  - DOMAIN-KEYWORD,gvt3,🌐 通用代理
