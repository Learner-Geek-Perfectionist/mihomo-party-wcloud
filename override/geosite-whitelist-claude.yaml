# ============================================================
# mihomo-party 覆写：MetaCubeX GEOSITE 白名单模式 + Claude 专用
# 数据源：geosite.dat (MetaCubeX/meta-rules-dat)
# ============================================================

# 添加 Claude 专用代理组（合并到订阅已有的代理组中）
+proxy-groups:
  - name: Claude专用
    type: select
    include-all-proxies: true
    filter: "美国家宽"
    icon: "https://claude.ai/favicon.ico"

rule-providers: {}

# 完整替换规则（白名单模式）
rules:
  # Claude 专用路由（最高优先级）
  - DOMAIN-SUFFIX,anthropic.com,Claude专用
  - DOMAIN-SUFFIX,claude.ai,Claude专用
  - DOMAIN,cdn.usefathom.com,Claude专用

  # Copilot 显式入口（不在 geosite:bing 内）
  - DOMAIN,api.msn.com,💬 人工智能
  - DOMAIN,assets.msn.com,💬 人工智能
  - DOMAIN,gateway.bingviz.microsoft.net,💬 人工智能
  - DOMAIN,gateway.bingviz.microsoftapp.net,💬 人工智能

  # 机场面板走代理（mojie.app 解析到中国 IP，不能走直连）
  - DOMAIN-SUFFIX,mojie.app,🚀 节点选择
  - DOMAIN-SUFFIX,mojie.co,🚀 节点选择
  - DOMAIN-SUFFIX,mojie.kim,🚀 节点选择
  - DOMAIN-SUFFIX,mojieai.com,🚀 节点选择

  # 广告 / 私有网络
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT

  # Bing 搜索走直连，剩余 Bing/Copilot 流量走 AI 组
  - GEOSITE,bing@cn,DIRECT
  - DOMAIN,bing.com,DIRECT
  - DOMAIN,www.bing.com,DIRECT
  - DOMAIN,www2.bing.com,DIRECT
  - DOMAIN-SUFFIX,tc.mm.bing.net,DIRECT
  - GEOSITE,bing,💬 人工智能

  # 国际服务的中国区子集走直连
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,icloud@cn,DIRECT
  - GEOSITE,google@cn,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT

  # 需要代理的国际服务
  - GEOSITE,youtube,🚀 节点选择
  - GEOSITE,google,🚀 节点选择
  - GEOSITE,github,🚀 节点选择
  - GEOSITE,telegram,🚀 节点选择
  - GEOSITE,twitter,🚀 节点选择
  - GEOSITE,category-scholar-!cn,🚀 节点选择

  # 兜底分流
  - GEOSITE,geolocation-!cn,🚀 节点选择
  - GEOSITE,cn,DIRECT

  # IP 规则
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,telegram,🚀 节点选择,no-resolve
  - GEOIP,CN,DIRECT

  - MATCH,🚀 节点选择
